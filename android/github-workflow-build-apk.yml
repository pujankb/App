name: Build Universal Android Release APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-release-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Live ASPD website/backend URL (leave default or paste your Vercel URL)'
        required: false
        default: 'https://ais-pre-xq3yx5xm5zgxj7qh3wvgzg-833661742984.asia-northeast1.run.app'

jobs:
  build-universal-apk:
    name: Build Signed Universal Release APK (API 24-35)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure release signing keystore
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "Using repository secret signing keystore..."
            echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks
            cat <<EOF > keystore.properties
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF
          else
            echo "No permanent keystore secrets configured; generating a signed release keystore for universal APK install..."
            GEN_PASS=$(openssl rand -hex 20)
            keytool -genkeypair -v \
              -keystore release-keystore.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias aspd-release \
              -storepass "$GEN_PASS" \
              -keypass "$GEN_PASS" \
              -dname "CN=ASPD, OU=Education, O=ASPD, L=India, C=IN"
            cat <<EOF > keystore.properties
          storeFile=release-keystore.jks
          storePassword=$GEN_PASS
          keyAlias=aspd-release
          keyPassword=$GEN_PASS
          EOF
          fi

      - name: Build Universal Signed Release APK (ASPD-Release.apk)
        working-directory: android
        env:
          ASPD_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://ais-pre-xq3yx5xm5zgxj7qh3wvgzg-833661742984.asia-northeast1.run.app' }}
        run: |
          gradle assembleRelease --no-daemon -PASPD_API_BASE_URL="$ASPD_API_BASE_URL"
          ls -lh app/build/outputs/apk/release/

      - name: Verify APK signature & universal compatibility
        working-directory: android
        run: |
          APK_PATH="app/build/outputs/apk/release/ASPD-Release.apk"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK_PATH"

      - name: Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASPD-Universal-Release-APK
          path: android/app/build/outputs/apk/release/ASPD-Release.apk
          retention-days: 90
